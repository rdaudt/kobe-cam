<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kobe-Cam Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --surface: #1a1d23;
    --border: #2a2d35;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --accent: #22c55e;
    --radius: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .setup.hidden { display: none; }
  .setup label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    width: 100%;
  }
  .setup input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .setup input:focus { border-color: var(--accent); }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #000;
  }
  .btn:active { opacity: 0.8; }
  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .viewer.hidden { display: none; }
  .viewer iframe {
    flex: 1;
    width: 100%;
    border: none;
  }
  .viewer-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .viewer-footer a {
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Kobe-Cam Viewer</h1>
  <span id="streamLabel" style="font-size:13px;color:var(--text-dim);"></span>
</div>

<div class="setup" id="setup">
  <div style="width:100%;">
    <label>Stream ID</label>
    <input type="text" id="inputStreamId" placeholder="e.g. kobe-cam-123">
  </div>
  <button class="btn" id="btnConnect">Connect</button>
</div>

<div class="viewer hidden" id="viewer">
  <iframe id="vdoFrame" allow="autoplay;fullscreen"></iframe>
  <div class="viewer-footer">
    <a id="btnDisconnect">Disconnect</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  const params = new URLSearchParams(window.location.search);
  const presetId = params.get('id') || '';

  const setup = document.getElementById('setup');
  const viewer = document.getElementById('viewer');
  const input = document.getElementById('inputStreamId');
  const frame = document.getElementById('vdoFrame');
  const label = document.getElementById('streamLabel');

  input.value = presetId || localStorage.getItem('kobecam-viewer-id') || '';

  function connect(streamId) {
    if (!streamId) { alert('Enter a Stream ID'); return; }
    localStorage.setItem('kobecam-viewer-id', streamId);
    frame.src = 'https://vdo.ninja/?room=' + encodeURIComponent(streamId) + '&view=' + encodeURIComponent(streamId) + '&scene&autoplay&cleanoutput';
    label.textContent = streamId;
    setup.classList.add('hidden');
    viewer.classList.remove('hidden');
  }

  function disconnect() {
    frame.src = '';
    viewer.classList.add('hidden');
    setup.classList.remove('hidden');
  }

  document.getElementById('btnConnect').addEventListener('click', () => connect(input.value.trim()));
  document.getElementById('btnDisconnect').addEventListener('click', disconnect);

  if (presetId) connect(presetId);
})();
</script>
</body>
</html>
