<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kobe-Cam Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --surface: #1a1d23;
    --border: #2a2d35;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --accent: #22c55e;
    --danger: #ef4444;
    --radius: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .status {
    font-size: 13px;
    color: var(--text-dim);
  }
  .status.connected { color: var(--accent); }
  .status.error { color: var(--danger); }

  .setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .setup.hidden { display: none; }
  .setup label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    width: 100%;
  }
  .setup input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .setup input:focus { border-color: var(--accent); }
  .setup .hint {
    font-size: 12px;
    color: var(--text-dim);
    width: 100%;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #000;
  }
  .btn:active { opacity: 0.8; }

  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
  }
  .viewer.hidden { display: none; }
  .viewer video {
    flex: 1;
    width: 100%;
    object-fit: contain;
    background: #000;
  }
  .viewer-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    text-align: center;
    background: var(--bg);
  }
  .viewer-footer a {
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
  }
  .viewer-footer a:hover { color: var(--text); }

  .connecting-msg {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 15px;
  }
  .connecting-msg.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Kobe-Cam Viewer</h1>
  <span class="status" id="status"></span>
</div>

<div class="setup" id="setup">
  <div style="width:100%;">
    <label>Stream ID</label>
    <input type="text" id="inputStreamId" placeholder="e.g. kobecam123">
  </div>
  <div class="hint">Enter the same Stream ID configured on the pet station.</div>
  <button class="btn" id="btnConnect">Watch Live</button>
</div>

<div class="connecting-msg hidden" id="connectingMsg">Connecting to pet station...</div>

<div class="viewer hidden" id="viewer">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="viewer-footer">
    <a id="btnDisconnect">Disconnect</a>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
(function() {
  'use strict';

  const params = new URLSearchParams(window.location.search);
  const presetId = params.get('id') || '';

  const setupEl = document.getElementById('setup');
  const viewerEl = document.getElementById('viewer');
  const connectingEl = document.getElementById('connectingMsg');
  const input = document.getElementById('inputStreamId');
  const remoteVideo = document.getElementById('remoteVideo');
  const statusEl = document.getElementById('status');

  let peer = null;
  let currentCall = null;
  let retryTimeout = null;

  input.value = presetId || localStorage.getItem('kobecam-viewer-id') || '';

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function connect(streamId) {
    if (!streamId) { alert('Enter a Stream ID'); return; }
    streamId = streamId.replace(/[^a-zA-Z0-9]/g, '');
    localStorage.setItem('kobecam-viewer-id', streamId);

    setupEl.classList.add('hidden');
    connectingEl.classList.remove('hidden');
    setStatus('Connecting...', '');

    var peerId = 'kobecam-' + streamId;

    peer = new Peer(undefined, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        ]
      }
    });

    peer.on('open', function() {
      var ctx = new AudioContext();
      var oscillator = ctx.createOscillator();
      var dst = ctx.createMediaStreamDestination();
      oscillator.connect(dst);
      oscillator.start();
      var dummyStream = dst.stream;
      dummyStream.getAudioTracks().forEach(function(t) { t.enabled = false; });

      var call = peer.call(peerId, dummyStream);
      currentCall = call;

      call.on('stream', function(remoteStream) {
        connectingEl.classList.add('hidden');
        viewerEl.classList.remove('hidden');
        remoteVideo.srcObject = remoteStream;
        setStatus('Live', 'connected');
      });

      call.on('close', function() {
        setStatus('Disconnected', 'error');
        scheduleRetry(streamId);
      });

      call.on('error', function(err) {
        setStatus('Error: ' + err.message, 'error');
        scheduleRetry(streamId);
      });
    });

    peer.on('error', function(err) {
      if (err.type === 'peer-unavailable') {
        setStatus('Pet station offline', 'error');
        scheduleRetry(streamId);
      } else {
        setStatus('Error: ' + err.message, 'error');
        scheduleRetry(streamId);
      }
    });

    peer.on('disconnected', function() {
      if (currentCall) {
        setStatus('Reconnecting...', '');
        peer.reconnect();
      }
    });
  }

  function scheduleRetry(streamId) {
    clearTimeout(retryTimeout);
    retryTimeout = setTimeout(function() {
      if (peer) { peer.destroy(); peer = null; }
      setStatus('Retrying...', '');
      connect(streamId);
    }, 5000);
  }

  function disconnect() {
    clearTimeout(retryTimeout);
    if (currentCall) { currentCall.close(); currentCall = null; }
    if (peer) { peer.destroy(); peer = null; }
    remoteVideo.srcObject = null;
    viewerEl.classList.add('hidden');
    connectingEl.classList.add('hidden');
    setupEl.classList.remove('hidden');
    setStatus('', '');
  }

  document.getElementById('btnConnect').addEventListener('click', function() {
    connect(input.value.trim());
  });
  document.getElementById('btnDisconnect').addEventListener('click', disconnect);

  if (presetId) connect(presetId);
})();
</script>
</body>
</html>
